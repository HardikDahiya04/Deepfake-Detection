<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 90%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(to right, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }
        .upload-zone {
            border: 2px dashed rgba(102, 126, 234, 0.4);
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 24px;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.08);
        }
        .upload-zone svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            fill: #667eea;
        }
        .upload-zone p { color: #aaa; }
        .upload-zone .filename {
            color: #667eea;
            font-weight: 600;
            margin-top: 8px;
        }
        input[type="file"] { display: none; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .result {
            margin-top: 28px;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            display: none;
        }
        .result.real { background: rgba(72, 187, 120, 0.15); border: 1px solid rgba(72, 187, 120, 0.3); }
        .result.fake { background: rgba(245, 101, 101, 0.15); border: 1px solid rgba(245, 101, 101, 0.3); }
        .result .label { font-size: 2rem; font-weight: 700; }
        .result.real .label { color: #48bb78; }
        .result.fake .label { color: #f56565; }
        .result .confidence { font-size: 1.1rem; color: #aaa; margin-top: 8px; }
        .result .fake-prob { font-size: 0.95rem; color: #bbb; margin-top: 12px; }
        .prob-bar { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin-top: 8px; overflow: hidden; }
        .prob-fill { height: 100%; border-radius: 5px; transition: width 0.6s ease; }
        .prob-fill.low { background: linear-gradient(90deg, #48bb78, #68d391); }
        .prob-fill.medium { background: linear-gradient(90deg, #ecc94b, #f6ad55); }
        .prob-fill.high { background: linear-gradient(90deg, #f56565, #fc8181); }
        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .video-preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            margin: 16px auto;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Deepfake Detector</h1>
        <p class="subtitle">Spatial-Temporal Attention Model for Video Authentication</p>

        <div class="upload-zone" id="dropZone">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
                <polyline points="14 2 14 8 20 8" fill="none" stroke="#667eea" stroke-width="1.5"/>
            </svg>
            <p>Drop a video here or click to browse</p>
            <p class="filename" id="fileName"></p>
        </div>
        <input type="file" id="fileInput" accept="video/*">

        <video class="video-preview" id="videoPreview" controls></video>

        <button class="btn" id="analyzeBtn" disabled>Analyze Video</button>
        <div class="spinner" id="spinner"></div>

        <div class="result" id="result">
            <div class="label" id="resultLabel"></div>
            <div class="confidence" id="resultConfidence"></div>
            <div class="fake-prob" id="fakeProbSection">
                <span>Fake Probability: <strong id="fakeProbValue"></strong></span>
                <div class="prob-bar"><div class="prob-fill" id="fakeProbBar"></div></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:8000'
            : window.location.origin;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const spinner = document.getElementById('spinner');
        const resultDiv = document.getElementById('result');
        const videoPreview = document.getElementById('videoPreview');
        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

        function handleFile(file) {
            selectedFile = file;
            document.getElementById('fileName').textContent = file.name;
            analyzeBtn.disabled = false;
            resultDiv.style.display = 'none';

            const url = URL.createObjectURL(file);
            videoPreview.src = url;
            videoPreview.style.display = 'block';
        }

        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            analyzeBtn.disabled = true;
            spinner.style.display = 'block';
            resultDiv.style.display = 'none';

            const formData = new FormData();
            formData.append('video', selectedFile);

            try {
                const res = await fetch(`${API_URL}/predict`, { method: 'POST', body: formData });
                const data = await res.json();

                const isReal = data.prediction === 'REAL';
                resultDiv.className = `result ${isReal ? 'real' : 'fake'}`;
                document.getElementById('resultLabel').textContent = data.prediction;
                const conf = data.confidence;
                const confText = (conf === null || conf === undefined || isNaN(conf))
                    ? 'Confidence: N/A (model not trained)'
                    : `Confidence: ${(conf * 100).toFixed(1)}%`;
                document.getElementById('resultConfidence').textContent = confText;

                // Show raw fake probability
                const fakeProb = data.fake_probability;
                if (fakeProb !== undefined && fakeProb !== null && !isNaN(fakeProb)) {
                    const pct = (fakeProb * 100).toFixed(1);
                    document.getElementById('fakeProbValue').textContent = `${pct}%`;
                    const bar = document.getElementById('fakeProbBar');
                    bar.style.width = `${pct}%`;
                    bar.className = 'prob-fill ' + (fakeProb < 0.3 ? 'low' : fakeProb < 0.6 ? 'medium' : 'high');
                }

                resultDiv.style.display = 'block';
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                analyzeBtn.disabled = false;
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
